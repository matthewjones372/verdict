name: dependency-graph

# Hands GitHub the resolved sbt graph, so Dependabot alerts cover the libraries verdict and its tests resolve.
# GitHub's own scan cannot read build.sbt, so without this the graph is empty.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: sbt/setup-sbt@v1

      - uses: scalacenter/sbt-dependency-submission@v3
